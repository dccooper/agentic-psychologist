<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Orientation video</title>
<!--
  The orientation video, as one deterministic web page: render(t) draws the frame at t seconds.
  Timing comes from build/<lang>/cues.js (made by the audio pipeline from the voiceover);
  every word on screen comes from strings.<lang>.js. Open with ?lang=en (default) and
  ?t=12.5 to inspect a moment in a browser. See README.md for the whole pipeline.
-->
<style>
@font-face { font-family: "Atkinson Hyperlegible"; font-weight: 400; src: url("../docs/assets/fonts/AtkinsonHyperlegible-Regular.woff2") format("woff2"); }
@font-face { font-family: "Atkinson Hyperlegible"; font-weight: 700; src: url("../docs/assets/fonts/AtkinsonHyperlegible-Bold.woff2") format("woff2"); }

/* ── Design tokens: the course site's "Harbor" palette. Change the look here. ── */
:root {
  --page: #FFFFFF; --surface: #EEF3F5; --text: #1E2A30; --muted: #4F5D64; --faint: #8A989F;
  --accent: #1F5F7A; --accent-2: #3E8AA8; --accent-soft: #DCEAF0; --accent-tint: #A9C5D2;
  --border: #D5DDE1; --hair: #E4EAED; --skel: #DCE4E8; --chrome: #EDF2F4; --panel: #F8FAFB;
  --good: #2F8A66; --warn: #B7791F; --stop: #A23B2A; --dark: #1E2A30; --dim: rgba(18,28,33,.58);
  --font: "Atkinson Hyperlegible", system-ui, sans-serif;
  --mono: ui-monospace, Consolas, Menlo, monospace;
  --radius: 16px;
  --shadow-win: 0 2px 4px rgba(30,42,48,.06), 0 18px 40px rgba(30,42,48,.12), 0 50px 100px rgba(30,42,48,.10);
  --shadow-chip: 0 8px 20px rgba(30,42,48,.10);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; font-family: var(--font); color: var(--text); }
body { background: radial-gradient(ellipse 1400px 900px at 50% 42%, #F6F9FA 0%, #E9EFF2 70%, #DEE6EA 100%); }
#stage { position: absolute; inset: 0; overflow: hidden; }
.grid { position: absolute; inset: 0; background-image: radial-gradient(circle, rgba(31,95,122,.15) 1.4px, transparent 1.6px);
  background-size: 32px 32px; -webkit-mask-image: radial-gradient(ellipse 1100px 700px at 50% 45%, transparent 35%, #000 100%); }
.scene { position: absolute; inset: 0; visibility: hidden; }
.abs { position: absolute; }
svg.i { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
u.sk { display: block; height: 12px; border-radius: 6px; background: var(--skel); text-decoration: none; }

/* Shared pieces */
.win { position: absolute; background: var(--page); border: 1px solid #C9D4D9; border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow-win); }
.win .bar { height: 44px; background: linear-gradient(#F4F7F8, var(--chrome)); border-bottom: 1px solid var(--border); display: flex; align-items: center;
  gap: 12px; padding: 0 16px; font-size: 17px; color: var(--muted); }
.win .bar .dots { display: flex; gap: 8px; } .win .bar .dots i { width: 12px; height: 12px; border-radius: 50%; background: var(--skel); display: block; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; border-radius: 10px; padding: 12px 24px; font-size: 23px; font-weight: 700;
  background: var(--accent); color: #fff; white-space: nowrap; }
.btn.ghost { background: var(--page); color: var(--text); border: 2px solid var(--border); }
.btn.dark { background: var(--dark); }
.chip { position: absolute; display: inline-flex; align-items: center; gap: 12px; background: var(--page); border: 1px solid var(--border); border-radius: 999px;
  padding: 12px 26px 12px 16px; font-size: 30px; box-shadow: var(--shadow-chip); white-space: nowrap; }
.chip svg { width: 34px; height: 34px; }
.chip.good svg { color: var(--good); } .chip.warn svg { color: var(--warn); } .chip.stop svg { color: var(--stop); } .chip.acc svg { color: var(--accent); }
.chip.solid { background: var(--accent); color: #fff; border-color: var(--accent); }
.ring { position: absolute; border-radius: 14px; box-shadow: 0 0 0 3px var(--accent), 0 0 0 10px rgba(169,197,210,.45); pointer-events: none; }
.spot { position: absolute; border-radius: 14px; box-shadow: 0 0 0 3px var(--accent), 0 0 0 10px rgba(169,197,210,.45), 0 0 0 4000px var(--dim); }
.label { position: absolute; background: var(--accent); color: #fff; border-radius: 999px; padding: 10px 28px 10px 10px; font-size: 29px; white-space: nowrap;
  display: flex; align-items: center; gap: 14px; box-shadow: 0 2px 0 rgba(255,255,255,.15) inset, 0 10px 28px rgba(0,0,0,.28); }
.label .n { width: 46px; height: 46px; border-radius: 50%; background: #fff; color: var(--accent); font-weight: 700; display: flex; align-items: center; justify-content: center; font-size: 26px; }
.label .sub { opacity: .85; }
.stamp { position: absolute; border: 5px solid var(--stop); color: var(--stop); font-weight: 700; letter-spacing: .16em; padding: 8px 22px; border-radius: 10px;
  font-size: 34px; background: rgba(255,255,255,.75); white-space: nowrap; }
.sticky { position: absolute; background: #FFF6C9; color: #4A4020; padding: 20px 24px; font-size: 28px; width: 320px; line-height: 1.25;
  box-shadow: 0 10px 22px rgba(0,0,0,.14); border-radius: 3px; }
.step { position: absolute; left: 60px; top: 46px; display: flex; align-items: center; gap: 12px; background: var(--page); border: 1px solid var(--border);
  border-radius: 999px; padding: 9px 24px 9px 10px; font-size: 27px; font-weight: 700; color: var(--accent); box-shadow: var(--shadow-chip); }
.step .dot { width: 34px; height: 34px; border-radius: 50%; background: var(--accent); }
.ptr { position: absolute; width: 40px; height: 40px; filter: drop-shadow(0 4px 6px rgba(0,0,0,.25)); z-index: 50; }
.rip { position: absolute; width: 60px; height: 60px; border-radius: 50%; border: 3px solid var(--accent); z-index: 49; }
.key { position: absolute; min-width: 160px; height: 116px; padding: 0 32px; border-radius: 20px; background: linear-gradient(#FFFFFF, #EEF3F5);
  border: 2px solid #2B3A41; box-shadow: 0 10px 0 #2B3A41, 0 22px 30px rgba(0,0,0,.25); display: flex; align-items: center; justify-content: center; gap: 14px;
  font-size: 44px; font-weight: 700; color: var(--text); z-index: 40; }
.key svg { width: 40px; height: 40px; stroke-width: 2.4; }
.appicon { width: 120px; height: 120px; border-radius: 28px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff;
  display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 22px rgba(31,95,122,.3); }
.appicon svg { width: 62px; height: 62px; stroke-width: 1.8; }
.cb { width: 32px; height: 32px; border-radius: 8px; border: 2px solid #9AAAB2; background: #fff; color: #fff; display: flex; align-items: center; justify-content: center; flex: none; }
.cb.on { background: var(--accent); border-color: var(--accent); }
.cb svg { width: 22px; height: 22px; stroke-width: 3; }

/* Cards (title and end) */
.card { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
  background: radial-gradient(ellipse 900px 600px at 50% 46%, #FFFFFF 0%, #F6F9FA 60%, #EAF0F3 100%); }
.card::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(circle, rgba(31,95,122,.14) 1.4px, transparent 1.6px);
  background-size: 32px 32px; -webkit-mask-image: radial-gradient(ellipse 900px 560px at 50% 46%, transparent 40%, #000 100%); }
.card > * { position: relative; }
.card img.crest { width: 168px; filter: drop-shadow(0 10px 18px rgba(30,42,48,.12)); }
.card .eyebrow { display: flex; align-items: center; gap: 22px; color: var(--accent); font-weight: 700; font-size: 28px; letter-spacing: .14em; }
.card .eyebrow i { display: block; height: 2px; width: 90px; background: linear-gradient(90deg, transparent, var(--accent)); }
.card .eyebrow i:last-child { background: linear-gradient(90deg, var(--accent), transparent); }
.card h1 { font-size: 84px; font-weight: 700; letter-spacing: -.012em; line-height: 1.05; text-align: center; }
.card h1 span { color: var(--faint); font-weight: 400; }
.card .sub { font-size: 32px; color: var(--muted); }
.card .foot { position: absolute; top: 46px; font-size: 22px; color: var(--faint); letter-spacing: .1em; }   /* the bottom belongs to captions */
.card .credit { position: absolute; top: 46px; font-size: 20px; color: var(--muted); }

/* Captions */
#caption { position: absolute; left: 50%; bottom: 22px; max-width: 1500px; text-align: center; z-index: 100;
  background: rgba(22,33,38,.94); color: #fff; font-size: 35px; line-height: 1.3; padding: 16px 38px; border-radius: 16px;
  box-shadow: 0 14px 34px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.08); border-bottom: 4px solid var(--accent-tint); }
#fadeBlack { position: absolute; inset: 0; background: #fff; z-index: 200; }

/* Scene-specific layout lives with each scene's builder below, as inline styles and a few classes */
.page h2 { font-size: 54px; letter-spacing: -.01em; }
.page .osTabs { display: flex; gap: 10px; }
.page .osTabs span { border: 1px solid var(--border); border-radius: 999px; padding: 8px 22px; font-size: 20px; color: var(--muted); }
.page .osTabs span.on { background: var(--dark); color: #fff; border-color: var(--dark); }
.codebox { background: #F1F5F7; border: 1px solid var(--border); border-radius: 12px; padding: 22px; display: flex; flex-direction: column; gap: 12px; }
.codebox u { background: #D3DDE2; }
.idecard { background: var(--page); border: 1px solid var(--border); border-radius: 14px; padding: 22px; display: flex; flex-direction: column; gap: 16px; font-size: 22px; font-weight: 700; }
.wizard .banner { position: absolute; left: 0; top: 44px; bottom: 0; width: 150px; background: linear-gradient(160deg, var(--accent), var(--accent-2)); }
.opt { display: flex; align-items: center; gap: 16px; border: 2px solid var(--border); border-radius: 12px; padding: 16px 20px; font-size: 27px; background: var(--page); }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt .badge { margin-left: auto; font-size: 16px; font-weight: 700; color: var(--good); border: 1px solid var(--good); border-radius: 999px; padding: 3px 12px; }
.radio { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #9AAAB2; flex: none; }
.opt.sel .radio { border: 8px solid var(--accent); }
.menu { position: absolute; background: var(--page); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 14px 34px rgba(30,42,48,.18); padding: 8px; width: 340px; }
.menu div { padding: 10px 16px; border-radius: 8px; font-size: 25px; position: relative; }
.menu .hi { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.fileicon { display: flex; flex-direction: column; align-items: center; gap: 10px; font-size: 24px; color: var(--muted); }
.fileicon svg { width: 96px; height: 96px; stroke-width: 1.3; color: var(--accent); }
.diff div { font-family: var(--mono); font-size: 24px; padding: 6px 22px; display: flex; gap: 18px; min-height: 40px; }
.diff .add { background: #E6F4EC; color: #1F5E43; }
.diff .add b { color: var(--good); }
.diff b { width: 16px; font-weight: 700; color: var(--faint); }

/* First look (the mock Antigravity window) */
#fl-win { position: absolute; left: 140px; top: 100px; width: 1640px; height: 790px; background: var(--page); border: 1px solid #C9D4D9; border-radius: 16px; overflow: hidden; box-shadow: var(--shadow-win); }
#fl-win .tb { left: 0; top: 0; width: 100%; height: 40px; background: linear-gradient(#F3F6F7, var(--chrome)); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 16px; color: var(--muted); }
#fl-win .tb .l { position: absolute; left: 16px; display: flex; gap: 14px; align-items: center; }
#fl-win .tb .r { position: absolute; right: 16px; display: flex; gap: 10px; }
#fl-win .tb .glyph { width: 18px; height: 18px; border-radius: 5px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
#fl-win .tb u { display: block; height: 8px; border-radius: 4px; background: var(--skel); }
#fl-win .tb .r u { width: 14px; height: 14px; border-radius: 4px; }
#fl-win .act { left: 0; top: 40px; width: 56px; bottom: 28px; background: var(--chrome); border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; gap: 20px; padding-top: 16px; color: #8FA0A8; }
#fl-win .act .on { color: var(--accent); }
#fl-win .act .gear { margin-top: auto; margin-bottom: 14px; }
#fl-win .exp { left: 56px; top: 40px; width: 300px; bottom: 28px; background: var(--panel); border-right: 1px solid var(--border); padding: 14px 0; }
#fl-win .exp .head { font-size: 13px; font-weight: 700; letter-spacing: .12em; color: var(--muted); padding: 0 18px 12px; }
#fl-win .exp .root { font-size: 13px; font-weight: 700; padding: 4px 12px; display: flex; gap: 6px; align-items: center; letter-spacing: .03em; }
#fl-win .exp .root svg { width: 16px; height: 16px; stroke-width: 2.4; }
#fl-win .exp .row { font-size: 18px; padding: 5px 18px 5px 26px; display: flex; gap: 8px; align-items: center; height: 34px; }
#fl-win .exp .chev { width: 14px; height: 14px; color: var(--faint); stroke-width: 2.4; }
#fl-win .exp .ico { width: 20px; height: 20px; stroke-width: 1.6; }
#fl-win .exp .dir .ico { color: var(--accent); fill: var(--accent-soft); }
#fl-win .exp .file { padding-left: 48px; } #fl-win .exp .file .ico { color: #7E9099; fill: #fff; }
#fl-win .ed { left: 356px; top: 40px; width: 804px; bottom: 28px; background: var(--page); background-image: radial-gradient(circle, rgba(31,95,122,.07) 1.2px, transparent 1.4px); background-size: 24px 24px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
#fl-win .ed .mark { width: 96px; height: 96px; border-radius: 26px; background: var(--page); border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; color: var(--accent-tint); }
#fl-win .ed .mark svg { width: 52px; height: 52px; stroke-width: 1.6; }
#fl-win .ed .big { font-size: 30px; color: #7A8A92; font-weight: 700; }
#fl-win .ed kbd { font-family: var(--font); font-size: 17px; color: var(--muted); background: var(--panel); border: 1px solid var(--border); border-bottom-width: 3px; border-radius: 7px; padding: 2px 9px; }
#fl-win .ed .keys { font-size: 19px; color: var(--faint); display: flex; gap: 10px; align-items: center; }
#fl-win .ag { left: 1160px; top: 40px; width: 480px; bottom: 28px; background: var(--panel); border-left: 1px solid var(--border); }
#fl-win .ag .agbar { height: 46px; border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 16px; font-size: 18px; font-weight: 700; gap: 10px; background: var(--page); }
#fl-win .ag .agbar .dotg { width: 9px; height: 9px; border-radius: 50%; background: #3FA27A; box-shadow: 0 0 0 3px rgba(63,162,122,.18); }
#fl-win .ag .agbar .tools { margin-left: auto; display: flex; gap: 14px; color: var(--faint); }
#fl-win .ag .agbar .tools svg { width: 20px; height: 20px; stroke-width: 2; }
#fl-win .ghost { position: absolute; left: 24px; right: 24px; top: 84px; display: flex; flex-direction: column; gap: 12px; }
#fl-win .ghost u { background: #E7EDF0; height: 10px; }
#fl-input { position: absolute; left: 16px; right: 16px; bottom: 16px; height: 92px; background: var(--page); border: 2px solid var(--border); border-radius: 14px;
  padding: 12px 14px 10px 16px; font-size: 19px; box-shadow: 0 4px 14px rgba(30,42,48,.06); display: flex; flex-direction: column; justify-content: space-between; }
#fl-input.focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(31,95,122,.16), 0 4px 14px rgba(30,42,48,.06); }
#fl-input .ph { color: var(--faint); } #fl-input .typed { font-family: var(--mono); font-size: 22px; }
#fl-input .foot { display: flex; align-items: center; gap: 10px; color: var(--faint); }
#fl-input .foot svg { width: 18px; height: 18px; stroke-width: 2.2; }
#fl-input .foot u { width: 74px; height: 18px; border-radius: 9px; background: #E7EDF0; }
#fl-send { margin-left: auto; width: 30px; height: 30px; border-radius: 50%; background: var(--accent-tint); color: #fff; display: flex; align-items: center; justify-content: center; }
#fl-send.ready { background: var(--accent); } #fl-send svg { width: 16px; height: 16px; stroke-width: 2.6; }
.caret { display: inline-block; width: 2px; height: 24px; background: var(--accent); vertical-align: -4px; margin-left: 1px; }
.cmdchip { display: inline-block; background: var(--accent-soft); color: var(--accent); border-radius: 7px; padding: 2px 10px; font-family: var(--mono); font-size: 21px; font-weight: 700; }
#fl-popup { position: absolute; left: 16px; right: 16px; bottom: 116px; background: var(--page); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 12px 32px rgba(30,42,48,.16); padding: 8px; font-size: 19px; }
#fl-popup .o { background: var(--accent-soft); border-radius: 8px; padding: 10px 12px; display: flex; gap: 14px; align-items: baseline; }
#fl-popup .o b { font-family: var(--mono); color: var(--accent); } #fl-popup .o em { font-style: normal; color: var(--muted); font-size: 17px; }
#fl-popup .o kbd { margin-left: auto; font-family: var(--font); font-size: 14px; color: var(--muted); border: 1px solid var(--accent-tint); border-radius: 5px; padding: 1px 7px; }
#fl-msgUser { position: absolute; right: 16px; bottom: 214px; background: var(--page); border: 1px solid var(--border); border-radius: 14px 14px 4px 14px; padding: 10px 14px; }
#fl-msgWork { position: absolute; left: 16px; bottom: 140px; font-size: 20px; color: var(--muted); display: flex; align-items: center; gap: 12px; background: var(--page); border: 1px solid var(--hair); border-radius: 14px; padding: 10px 16px; }
#fl-spinner { width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--accent-soft); border-top-color: var(--accent); }
#fl-win .st { left: 0; bottom: 0; width: 100%; height: 28px; background: var(--chrome); border-top: 1px solid var(--border); display: flex; align-items: center; gap: 14px; }
#fl-win .st .blk { width: 44px; height: 100%; background: var(--accent); }
#fl-win .st u { height: 8px; border-radius: 4px; background: var(--skel); }
.ignore { position: absolute; background: repeating-linear-gradient(45deg, #6E7C83 0 10px, #808D93 10px 20px); display: flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 700; font-size: 15px; letter-spacing: .14em; outline: 2px dashed rgba(255,255,255,.55); outline-offset: -5px; }

/* Out of character */
#oc-photo { position: absolute; left: 0; top: 0; width: 640px; height: 480px; border: 12px solid #fff; border-radius: 22px; background: #fff;
  box-shadow: 0 2px 4px rgba(30,42,48,.08), 0 18px 40px rgba(30,42,48,.16), 0 46px 90px rgba(30,42,48,.14); }
#oc-photo .crop { position: absolute; inset: 0; overflow: hidden; border-radius: 11px; }
#oc-photo img { position: absolute; width: 147.06%; left: -38.24%; top: -3.92%; }
#oc-tag { position: absolute; display: flex; align-items: center; gap: 12px; background: var(--page); border: 1px solid var(--border); border-radius: 999px;
  padding: 8px 18px 8px 12px; font-size: 24px; box-shadow: var(--shadow-chip); white-space: nowrap; }
#oc-tag span { color: var(--muted); }
.bars { display: flex; gap: 3px; align-items: center; height: 22px; width: 26px; justify-content: center; }
.bars i { display: block; width: 4px; border-radius: 2px; background: var(--accent); }
#oc-intro { position: absolute; left: 1030px; top: 330px; width: 820px; }
#oc-intro .eyebrow { display: flex; align-items: center; gap: 18px; color: var(--accent); font-weight: 700; font-size: 24px; letter-spacing: .14em; }
#oc-intro .eyebrow i { display: block; height: 2px; width: 60px; background: var(--accent); }
#oc-intro h1 { font-size: 76px; line-height: 1.05; margin: 22px 0 18px; letter-spacing: -.01em; }
#oc-intro p { font-size: 34px; color: var(--muted); }
.oc-panel { position: absolute; left: 150px; width: 1140px; }
#oc-notice .head { height: 64px; display: flex; align-items: center; gap: 14px; padding: 0 28px; border-bottom: 1px solid var(--border); background: linear-gradient(#F6F9FA, #EEF3F5); font-size: 25px; font-weight: 700; }
#oc-notice .head svg { color: var(--accent); width: 30px; height: 30px; }
#oc-notice .head em { margin-left: auto; font-style: normal; font-size: 16px; font-weight: 700; letter-spacing: .12em; color: var(--faint); }
#oc-para { position: relative; padding: 18px 22px; border-radius: 12px; display: flex; flex-direction: column; gap: 14px; }
#oc-para u { position: relative; height: 14px; border-radius: 7px; }
.hl { position: absolute; inset: 0; border-radius: 12px; background: rgba(220,234,240,.7); box-shadow: inset 4px 0 0 var(--accent); }
#oc-paraTag { position: absolute; right: 18px; top: -20px; background: var(--accent); color: #fff; font-size: 23px; font-weight: 700; border-radius: 999px; padding: 6px 16px; }
.oc-check { display: flex; align-items: center; gap: 18px; padding: 16px 22px; margin-top: 18px; border-radius: 12px; font-size: 25px; position: relative; }
#oc-chkTag { position: absolute; right: 18px; top: 50%; background: var(--good); color: #fff; font-size: 24px; font-weight: 700; border-radius: 999px; padding: 7px 18px; }
#oc-rule .badge { display: inline-flex; align-items: center; gap: 12px; background: var(--accent); color: #fff; font-weight: 700; font-size: 24px; letter-spacing: .14em; border-radius: 999px; padding: 10px 24px 10px 16px; }
#oc-rule .badge svg { width: 30px; height: 30px; stroke-width: 2.2; }
#oc-rule h2 { font-size: 58px; line-height: 1.18; margin-top: 30px; }

<script>
/* ═══ Timing helpers ═══════════════════════════════════════════════════════ */
const S = window.STRINGS, U = S.ui, C = window.CUES;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ramp = (t, a, b) => clamp((t - a) / (b - a));
const ease = x => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
const out = x => 1 - Math.pow(1 - x, 3);
const c1 = 1.70158, c3 = c1 + 1;
const backOut = x => 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
const backIn = x => c3 * x * x * x - c1 * x * x;
const fade = (t, a, b, c, d) => Math.min(ease(ramp(t, a, b)), 1 - ease(ramp(t, c, d)));
const lerp = (a, b, k) => a + (b - a) * k;
const $ = id => document.getElementById(id);
const norm = w => w.toLowerCase().replace(/[’]/g, "'").replace(/[^a-z0-9'\-]/g, '');
const Ls = n => C.lines[n].start, Le = n => C.lines[n].end;

// A(key): when an anchored beat happens. Anchors live in the strings file so a translation can re-point them.
const anchorCache = {};
function A(key) {
  if (key in anchorCache) return anchorCache[key];
  const [n, w, add = 0, nth = 1] = S.anchors[key], L = C.lines[n];
  let time = null;
  if (typeof w === 'number') time = L.start + w * (L.end - L.start);
  else {
    for (const exact of [true, false]) {
      let seen = 0;
      for (const [s, , word] of L.words) {
        const x = norm(word);
        if (exact ? x === w : x.startsWith(w)) { if (++seen === nth) { time = s; break; } }
      }
      if (time !== null) break;
    }
    if (time === null) { console.warn('anchor not found:', key); time = L.start + 0.5 * (L.end - L.start); }
  }
  return anchorCache[key] = time + add;
}

function show(el, o) { el.style.opacity = o; el.style.visibility = o > 0.001 ? 'visible' : 'hidden'; }
function place(el, x, y, w, h) { el.style.left = x + 'px'; el.style.top = y + 'px'; if (w != null) { el.style.width = w + 'px'; el.style.height = h + 'px'; } }
// Arrive: fade in rising from below at `a`, leave by `b` (omit b to stay)
function rise(el, t, a, b = 1e9, dist = 22) {
  const k = out(ramp(t, a, a + 0.55));
  show(el, Math.min(ease(ramp(t, a, a + 0.45)), 1 - ease(ramp(t, b - 0.35, b))));
  el.style.transform = `translateY(${(1 - k) * dist}px)`;
}
// Pop: springs in at `a` (scale with overshoot), out by `b`
function pop(el, t, a, b = 1e9, base = '') {
  const k = backOut(ramp(t, a, a + 0.45)) * (1 - backIn(ramp(t, b - 0.3, b)));
  show(el, clamp(ramp(t, a, a + 0.12)) * (1 - ramp(t, b - 0.05, b)));
  el.style.transform = `${base} scale(${Math.max(0, k)})`;
}
// Pointer: glides through keyframes [{t,x,y}], clicks at times in `clicks`; the ripple shows each click
function drive(ptr, rip, t, keys, clicks = [], until = null) {
  if (!keys.length) return show(ptr, 0);
  let p = keys[0];
  for (let i = 1; i < keys.length; i++) {
    const a = keys[i - 1], b = keys[i], k = out(ramp(t, b.t - (b.d || 0.8), b.t));
    if (t >= b.t - (b.d || 0.8)) p = { x: lerp(a.x, b.x, k), y: lerp(a.y, b.y, k) - 24 * Math.sin(Math.PI * k) };
  }
  place(ptr, p.x, p.y);
  const end = until ?? keys[keys.length - 1].t + 1.2;
  show(ptr, fade(t, keys[0].t - 0.3, keys[0].t, end, end + 0.3));
  let tap = 0, rk = -1, rp = p;
  for (const c of clicks) {
    tap = Math.max(tap, ramp(t, c, c + 0.08) - ramp(t, c + 0.12, c + 0.22));
    if (t >= c && t < c + 0.5) { rk = ramp(t, c, c + 0.5); rp = p; }
  }
  ptr.style.transform = `scale(${1 - 0.12 * tap})`; ptr.style.transformOrigin = '20% 10%';
  if (rip) { place(rip, rp.x - 25, rp.y - 27); rip.style.transform = `scale(${0.3 + 0.9 * out(clamp(rk))})`; show(rip, rk >= 0 && rk < 1 ? 1 - rk : 0); }
}
function press(el, t, at) {
  const o = fade(t, at - 0.6, at - 0.3, at + 0.6, at + 0.9);
  show(el, o);
  const down = ramp(t, at, at + 0.08) - ramp(t, at + 0.15, at + 0.25);
  el.style.transform = `translateY(${down * 10 + (1 - out(ramp(t, at - 0.6, at - 0.25))) * 24}px)`;
  el.style.boxShadow = `0 ${10 - down * 10}px 0 #2B3A41, 0 ${22 - down * 14}px 30px rgba(0,0,0,.25)`;
}
function stagger(root, t, t0) {
  for (const el of root.querySelectorAll('[data-in]')) {
    const k = out(ramp(t, t0 + +el.dataset.in, t0 + +el.dataset.in + 0.55));
    el.style.opacity = k; el.style.transform = `translateY(${(1 - k) * 22}px)`;
  }
  for (const r of root.querySelectorAll('[data-rule]')) r.style.width = 90 * out(ramp(t, t0 + 0.6, t0 + 1.3)) + 'px';
}
const I = (id, cls = '') => `<svg class="i ${cls}"><use href="#i-${id}"/></svg>`;
const PTR = id => `<svg id="${id}" class="ptr" viewBox="0 0 24 24"><path d="M5 3l14 8.2-6.2 1.3 3.6 6.8-2.6 1.4-3.6-6.8L5.6 18.6z" fill="#1E2A30" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg><div id="${id}-r" class="rip"></div>`;
const SK = (w, h = 12, extra = '') => `<u class="sk" style="width:${w}px;height:${h}px;${extra}"></u>`;
const stepChip = text => `<div class="step"><span class="dot"></span>${text}</div>`;

/* ═══ Scenes: each has build() → HTML and draw(t) for its slice of the timeline ═══ */
const SCENES = {};

/* ── Title: lines 1–2 ── */
SCENES.title = {
  build: () => `
    <div class="card" id="ti-card">
      <img class="crest" data-in="0.15" src="../docs/assets/logo/uot-crest.svg" alt="">
      <div class="eyebrow" data-in="0.45"><i data-rule></i>${U.university}<i data-rule></i></div>
      <div class="sub" data-in="0.6" style="font-size:30px">${U.department}</div>
      <h1 data-in="0.8">${U.orientation} <span>${U.videoTag}</span></h1>
      <div class="sub" id="ti-replaces" style="font-style:italic">${U.replaces}</div>
      <div class="foot" data-in="1.2">${U.footer}</div>
    </div>
    <div id="ti-pending" class="abs" style="left:110px;top:110px;background:#fff;border:1px solid var(--border);border-radius:16px;padding:20px 30px 20px 26px;box-shadow:var(--shadow-win);border-left:6px solid var(--accent)">
      <div style="font-size:36px;font-weight:700">${U.pendingName}</div>
      <div style="font-size:24px;color:var(--muted);margin-top:4px">${U.pendingRole}</div>
    </div>
    <div id="ti-stamp" class="stamp" style="left:560px;top:130px">${U.provisional}</div>`,
  draw(t, s) {
    stagger($('ti-card'), t, s.start);
    rise($('ti-replaces'), t, A('replaces'));
    const p = $('ti-pending'), k = out(ramp(t, A('pending') - 0.2, A('pending') + 0.4));
    show(p, k); p.style.transform = `translateX(${(1 - k) * -40}px)`;
    const st = $('ti-stamp'), sk = ramp(t, A('provisionally'), A('provisionally') + 0.18);
    show(st, sk > 0 ? 0.9 : 0); st.style.transform = `rotate(-8deg) scale(${lerp(1.8, 1, out(sk))})`;
  },
};

/* ── Download the right app: lines 3–5 ── */
SCENES.download = {
  build: () => `
    ${stepChip(U.sectionDownload)}
    <div class="win" id="dl-win" style="left:260px;top:120px;width:1400px;height:760px">

          ${I('lock')}<span id="dl-urltext"></span></div></div>
      <div style="position:absolute;left:0;right:0;top:44px;bottom:0;overflow:hidden">

          <section style="margin-top:90px"><h2>${U.cliHeading}</h2>
            <div class="codebox" style="margin-top:22px;width:900px">${SK(520, 12)}${SK(380, 12)}</div></section>
          <section style="margin-top:90px"><h2>${U.idesHeading}</h2>

          <section id="dl-sa" style="margin-top:90px;position:relative">
            <h3 id="dl-sah" style="font-size:22px;display:inline-block">${U.standaloneHeading}</h3>
            <div style="display:flex;gap:70px;margin-top:22px">
              <div><div style="font-size:18px;color:var(--muted);margin-bottom:12px;display:flex;gap:8px;align-items:center">${I('win')}${U.winLabel}</div>
                <div style="display:flex;gap:12px"><span class="btn" id="dl-x64">${U.winButtons[0]}</span><span class="btn ghost">${U.winButtons[1]}</span></div></div>
              <div><div style="font-size:18px;color:var(--muted);margin-bottom:12px;display:flex;gap:8px;align-items:center">${I('mac')}${U.macLabel}</div>
                <div style="display:flex;gap:12px"><span class="btn" id="dl-as">${U.macButtons[0]}</span><span class="btn ghost" id="dl-intel">${U.macButtons[1]}</span></div></div>
            </div>
            <div style="height:400px"></div>
          </section>
        </div>
        <div class="ring" id="dl-ring"></div>
      </div>
    </div>
    <div class="ring" id="dl-urlring"></div>
    <div class="label" id="dl-this" style="left:0;top:0"><span class="n">${I('tick')}</span><b>${U.thisOne}</b></div>
    <div class="sticky" id="dl-note" style="left:1480px;top:220px">${U.complaint}</div>
    <div class="chip acc" id="dl-hint" style="left:0;top:0">${I('circle-tick')}<span id="dl-hinttext"></span></div>`,
  draw(t, s) {
    const win = $('dl-win'), wi = out(ramp(t, s.start, s.start + 0.8));
    win.style.transform = `translateY(${(1 - wi) * 30}px) scale(${0.97 + 0.03 * wi})`;
    // Address bar types out as he says it
    const url = U.browserUrl, n = Math.floor(clamp((t - A('downloadUrl')) / 1.4) * url.length);
    $('dl-urltext').textContent = t < A('downloadUrl') ? '' : url.slice(0, Math.max(n, 0));
    const ur = $('dl-urlring'); place(ur, 260 + 92, 120 + 7, 1290, 30); show(ur, fade(t, A('downloadUrl'), A('downloadUrl') + 0.3, A('appSection') - 0.2, A('appSection') + 0.2));
    // Not this one
    show($('dl-x'), ease(ramp(t, A('notTheOne'), A('notTheOne') + 0.3)));

// Captions: each spoken line (with spelling fixes) split into readable chunks,
// each timed from the word it starts on. Exposed as window.CAPTIONS for the .srt export.
function buildCaptions() {
  const caps = [], fixes = S.captionFixes.map(([p, r]) => [new RegExp(p, 'gi'), r]);
  for (const n of Object.keys(C.lines).sort((a, b) => C.lines[a].start - C.lines[b].start)) {
    const L = C.lines[n], raw = L.words.map(w => w[2]).join(' ').replace(/\s+-/g, '-').replace(/ \./g, '.');
    let text = raw; for (const [re, r] of fixes) text = text.replace(re, r);
    text = text.replace(/\s+/g, ' ').trim();
    // Sentences, then long sentences split at a comma near the middle, then short neighbours merged
    let parts = text.split(/(?<=[.!?])\s+/);
    parts = parts.flatMap(p => { if (p.length <= 84) return [p]; const mid = p.length / 2; let best = -1;
      for (let i = p.indexOf(', '); i >= 0; i = p.indexOf(', ', i + 1)) if (best < 0 || Math.abs(i - mid) < Math.abs(best - mid)) best = i;
      if (best < 0) { best = p.lastIndexOf(' ', mid); return [p.slice(0, best), p.slice(best + 1)]; } return [p.slice(0, best + 1), p.slice(best + 2)]; });
    const merged = []; for (const p of parts) { if (merged.length && (merged[merged.length - 1] + ' ' + p).length <= 72) merged[merged.length - 1] += ' ' + p; else merged.push(p); }
    // Time each chunk by where it falls in the line (proportional to characters)
    const total = merged.join(' ').length, starts = []; let acc = 0;
    const cum = []; let c = 0; for (const w of L.words) { cum.push(c); c += w[2].length + 1; }
    for (const p of merged) {
      const f = acc / total * c; let k = 0; while (k + 1 < cum.length && cum[k + 1] <= f) k++;
      starts.push(acc === 0 ? L.start : L.words[k][0]); acc += p.length + 1;
    }
    merged.forEach((p, i) => caps.push([starts[i] - 0.05, i + 1 < merged.length ? starts[i + 1] - 0.05 : L.end + 0.35, p]));
  }
  return caps;
}
window.CAPTIONS = buildCaptions();

  const cap = $('caption'); let co = 0, cy = 0;
  for (const [a, b, text] of window.CAPTIONS) {
    const o = fade(t, a, a + 0.2, b - 0.2, b);
    if (o > 0) { co = o; cap.textContent = text; cy = (1 - out(ramp(t, a, a + 0.3))) * 10; }
  }
  cap.style.transform = `translate(-50%, ${cy}px)`; show(cap, co);
  show($('fadeBlack'), ramp(t, C.duration - 0.8, C.duration));
}
window.DURATION = C.duration;
render(+(new URLSearchParams(location.search).get('t') || 0));
</script>
