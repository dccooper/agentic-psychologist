<link rel="icon" href="{{ '/assets/logo/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="stylesheet" href="{{ '/assets/css/uot-tokens.css' | relative_url }}">
{% if site.preview_noindex %}<meta name="robots" content="noindex, nofollow">{% endif %}
<script>
  // Follow the visitor's light/dark setting on course pages (Harbor / Harbor dark).
  (function () {
    var media = window.matchMedia('(prefers-color-scheme: dark)');
    function apply() {
      if (window.jtd && jtd.setTheme) { jtd.setTheme(media.matches ? 'harbor-dark' : 'default'); }
    }
    apply();
    if (media.addEventListener) { media.addEventListener('change', apply); }
  })();
</script>
