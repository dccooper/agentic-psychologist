<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Source for social-preview.png (1200x630). Regenerate with headless Chrome:
     chrome --headless --hide-scrollbars --window-size=1200,630 --screenshot=social-preview.png card.html -->
<style>
  @font-face { font-family: "Atkinson Hyperlegible"; src: url("../fonts/AtkinsonHyperlegible-Regular.woff2") format("woff2"); font-weight: 400; }
  @font-face { font-family: "Atkinson Hyperlegible"; src: url("../fonts/AtkinsonHyperlegible-Bold.woff2") format("woff2"); font-weight: 700; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #FFFFFF; color: #1E2A30; font-family: "Atkinson Hyperlegible", sans-serif;
    display: grid; grid-template-columns: 1fr 300px; align-items: center; gap: 56px;
    padding: 0 80px; box-sizing: border-box; border-top: 14px solid #1F5F7A;
  }
  .eyebrow { color: #1F5F7A; font-weight: 700; font-size: 28px; margin: 0 0 22px; }
  h1 { font-size: 64px; line-height: 1.08; margin: 0 0 28px; letter-spacing: -0.01em; }
  .sub { font-size: 28px; color: #4F5D64; margin: 0; }
  .name { font-weight: 700; color: #1E2A30; }
  .crest { width: 300px; height: auto; }
</style>
</head>
<body>
  <div>
    <p class="eyebrow">For psychologists who don't know where to start with AI</p>
    <h1>Learn the basics of AI agents in 20-minute lessons. No coding required.</h1>
    <p class="sub"><span class="name">The Agentic Psychologist</span> · free and open</p>
  </div>
  <img class="crest" src="../logo/uot-crest.svg" alt="">
</body>
</html>
