title: The Agentic Psychologist
description: A free, hands-on course where psychologists learn the basics of AI agents, inside the tool, in 20-minute lessons.
url: https://dccooper.github.io
baseurl: /agentic-psychologist
permalink: pretty

remote_theme: just-the-docs/just-the-docs@v0.10.1
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap

# Link previews (Open Graph / Twitter cards) for every page.
logo: /assets/logo/uot-mark.svg
defaults:
  - scope:
      path: ""
    values:
      image: /assets/social/social-preview.png
twitter:
  card: summary_large_image

color_scheme: harbor
search_enabled: true
heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

aux_links:
  "GitHub":
    - "https://github.com/dccooper/agentic-psychologist"
aux_links_new_tab: false

footer_content: 'The Agentic Psychologist · Content <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a> · Code <a href="https://github.com/dccooper/agentic-psychologist/blob/main/LICENSE-CODE">MIT</a> · <a href="https://github.com/dccooper/agentic-psychologist">GitHub</a>'

# true keeps the site out of search engines (the noindex tag in _includes/head_custom.html
# and _layouts/home.html). Launched 2026-10-30: indexed.
preview_noindex: false

# No analytics, ever: leave ga_tracking unset.

exclude:
  - assets/social/card.html
  - Gemfile
  - Gemfile.lock
  - vendor
